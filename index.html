<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Titolo e descrizione -->
    <title>cnaeventi</title>
    <meta name="description" content="Portale di gestione eventi CNA Roma" />
    <meta name="application-name" content="cnaeventi" />

    <!-- Favicon browser -->
    <link rel="icon" type="image/x-icon"   href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml"  href="/favicon.svg" />

    <!-- Apple (salvataggio su iPhone/iPad) -->
    <link rel="apple-touch-icon" href="/cn-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cnaeventi" />

    <!-- PWA manifest (Android + Chrome) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#003DA5" />

    <!-- Windows tile -->
    <meta name="msapplication-TileImage" content="/cn-icon-144.png" />
    <meta name="msapplication-TileColor" content="#003DA5" />

    <!-- Open Graph -->
    <meta property="og:title"       content="cnaeventi" />
    <meta property="og:description" content="Portale di gestione eventi CNA Roma" />
    <meta property="og:image"       content="/cn-icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Forza aggiornamento cache/SW quando cambia BUILD_STAMP
      (function () {
        var BUILD_STAMP = '2026-08-05-cnaeventi-rebrand';
        try {
          var saved = localStorage.getItem('cna-build-stamp');
          if (saved === BUILD_STAMP) return;

          var cleanup = [];
          if ('caches' in window) {
            cleanup.push(
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              })
            );
          }
          if ('serviceWorker' in navigator) {
            cleanup.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          Promise.all(cleanup).finally(function () {
            localStorage.setItem('cna-build-stamp', BUILD_STAMP);
            if (saved) {
              window.location.reload();
            }
          });
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
